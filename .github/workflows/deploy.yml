name: Deploy to EC2

on:
  push:
    branches: [main1]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/app
            git fetch origin main1
            git reset --hard origin/main1
            npm ci --omit=dev
            pm2 restart joy
            # give the app a moment to bind the port, then health-check
            for i in 1 2 3 4 5; do
              sleep 2
              curl -sf http://localhost:3000 > /dev/null && exit 0
            done
            echo "app did not respond on :3000" >&2
            pm2 logs joy --lines 20 --nostream
            exit 1
